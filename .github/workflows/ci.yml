name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up documentation tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check Markdown and local links
        run: npm run check:docs

  native:
    name: Native macOS
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report native toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test release version validation
        run: python3 -m unittest discover -s scripts/tests
      - name: Build native application
        env:
          BAMDALF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/build-htslib.sh
          unset BAMDALF_GITHUB_TOKEN
          swift build
      - name: Test viewer session and native workspace
        run: bash scripts/test.sh
      - name: Package native application
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          bash scripts/package-release.sh "v$version"

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [documentation, native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
